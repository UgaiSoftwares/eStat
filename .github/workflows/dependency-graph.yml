name: Update Dependency Graph
on:
  push:
    branches: [master2]
permissions:
  contents: write
jobs:
  dependency-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          java-version: '11'
          distribution: temurin
          cache: maven
      - run: ./mvnw -B compile
      - uses: advanced-security/maven-dependency-submission-action@v6
