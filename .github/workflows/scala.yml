# separate terms of service, privacy policy, and support
# documentation.

name: Maven CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
    - name: Set up JDK 11
      uses: actions/setup-java@v6.2.0
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: 'maven'
    - name: Build and test
      run: ./mvnw -B verify
